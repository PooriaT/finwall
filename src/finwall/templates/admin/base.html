<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Finwall Admin</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body>
  <header class="site-header">
    <div><a class="brand" href="/admin">Finwall Admin</a><p>Internal self-managed portfolio maintenance</p></div>
    {% if active_nav != 'login' %}
    <form method="post" action="/admin/logout"><button class="button secondary" type="submit">Logout</button></form>
    {% endif %}
  </header>
  {% if active_nav != 'login' %}
  <nav class="nav" aria-label="Admin navigation">
    {% for key, label, href in nav_items %}<a href="{{ href }}" class="{% if active_nav == key %}active{% endif %}">{{ label }}</a>{% endfor %}
  </nav>
  {% endif %}
  <main class="container">
    {% if flash %}<div class="flash" role="status"><strong>{{ flash }}</strong></div>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
