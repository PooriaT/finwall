{% extends "admin/base.html" %}{% block content %}<h1>Orders</h1><div class="form-grid"><section class="panel"><h2>Add or update order</h2><form method="post" action="/admin/orders" class="stacked-form"><label>Ticker<input name="ticker" required></label><label>Side<input name="side" placeholder="buy or sell" required></label><label>Order type<input name="order_type" placeholder="market, limit, stop, stop_limit" required></label><label>Shares<input name="shares" required></label><label>Limit price<input name="limit_price"></label><label>Stop price<input name="stop_price"></label><button class="button">Save order</button></form></section><section class="panel"><h2>Delete order</h2><form method="post" action="/admin/orders/delete" class="stacked-form"><label>Ticker<input name="ticker" required></label><button class="button danger">Delete order</button></form></section></div>{% endblock %}
